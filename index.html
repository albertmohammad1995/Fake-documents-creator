<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f4f8; color: #333; display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 70px; }
        .container { padding: 12px; max-width: 450px; margin: auto; width: 100%; flex: 1; }
        .profile-section { text-align: center; margin-bottom: 12px; margin-top: 10px; }
        .profile-logo { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #3b82f6; object-fit: cover; margin: 0 auto 4px; display: block; background: #fff; }
        .powered-text { font-size: 12px; color: #64748b; font-weight: 600; }
        .banner { background: linear-gradient(135deg, #1d4ed8, #3b82f6); color: white; padding: 14px; border-radius: 12px; margin-bottom: 12px; }
        .banner h3 { font-size: 15px; margin-bottom: 4px; }
        .banner p { font-size: 11px; opacity: 0.9; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: white; padding: 12px; border-radius: 12px; text-align: center; font-size: 12px; font-weight: 600; color: #1e293b; border: 1px solid #e2e8f0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 75px; cursor: pointer; }
        .card span { font-size: 22px; margin-bottom: 4px; }
        .app-section { display: none; }
        .app-section.active { display: block; }
        .file-item { background: white; padding: 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #cbd5e1; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; padding: 15px; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
        .modal-content h3 { font-size: 16px; margin-bottom: 8px; color: #1e293b; }
        .modal-content label { font-size: 11px; font-weight: bold; display: block; margin-top: 8px; color: #334155; }
        .modal-content select, .modal-content input { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .btn-close { background: #ef4444; color: white; border: none; padding: 9px; border-radius: 6px; flex: 1; cursor: pointer; font-weight: bold; }
        .btn-proceed { background: #22c55e; color: white; border: none; padding: 9px; border-radius: 6px; flex: 1; cursor: pointer; font-weight: bold; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #e2e8f0; cursor: pointer; }
        .nav-item { text-align: center; font-size: 10px; color: #64748b; text-decoration: none; }
        .nav-item.active { color: #2563eb; font-weight: bold; }
        .nav-item div { font-size: 16px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="container">
        <div id="homeSection" class="app-section active">
            <div class="profile-section">
                <img src="https://lh3.googleusercontent.com/d/1RD7n4OFI_snC8996JEHZahYD1NCWyX1U" alt="Logo" class="profile-logo">
                <div class="powered-text">Powered by @Ahsawon1995</div>
            </div>
            <div class="banner">
                <h3>Create Your Own Fake Document.</h3>
                <p>Bank Statement, Utility Bill, TIN, Birth Certificate, and more.</p>
            </div>
            <div class="grid">
                <div class="card" onclick="openDocModal('Bank Statements')"><span>🏛️</span>Bank Statements</div>
                <div class="card" onclick="openDocModal('Utility Bills')"><span>💧</span>Utility Bills</div>
                <div class="card" onclick="openDocModal('TIN Certificate')"><span>📄</span>TIN Certificate</div>
                <div class="card" onclick="openDocModal('Birth Certificates')"><span>👶</span>Birth Certificates</div>
            </div>
        </div>

        <div id="filesSection" class="app-section">
            <h3 style="margin-bottom: 12px; color: #1e293b;">📁 My Saved Files</h3>
            <div id="filesList">
                <p style="font-size: 13px; color: #64748b; text-align: center; margin-top: 30px;">আপনার কোনো ফাইল সেভ করা নেই।</p>
            </div>
        </div>
    </div>

    <div id="docModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Document Request</h3>
            <label>Select Country / দেশ নির্বাচন করুন:</label>
            <select id="countrySelect">
                <option value="Bangladesh">🇧🇩 বাংলাদেশ (Bangladesh)</option>
                <option value="USA">🇺🇸 যুক্তরাষ্ট্র (United States)</option>
            </select>

            <label>New Name (নতুন নাম):</label>
            <input type="text" id="newNameInput" placeholder="Enter name">

            <label>New Date (তারিখ):</label>
            <input type="date" id="newDateInput">

            <div class="modal-buttons">
                <button class="btn-close" onclick="closeModal()">Cancel</button>
                <button class="btn-proceed" onclick="submitRequest()">Submit Request</button>
            </div>
        </div>
    </div>

    <div class="bottom-navigation bottom-nav">
        <a onclick="switchTab('home')" class="nav-item active" id="navHome"><div>🏠</div>Home</a>
        <a onclick="switchTab('files')" class="nav-item" id="navFiles"><div>📁</div>My Files</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        try { tg.expand(); } catch (e) {}

        let selectedCategory = "";

        function openDocModal(docType) {
            selectedCategory = docType;
            document.getElementById('modalTitle').innerText = docType + " - Request";
            document.getElementById('docModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('docModal').style.display = 'none';
        }

        function submitRequest() {
            let country = document.getElementById('countrySelect').value;
            let name = document.getElementById('newNameInput').value;
            let date = document.getElementById('newDateInput').value;

            if(!name || !date) {
                alert("দয়া করে নাম এবং তারিখ পূরণ করুন!");
                return;
            }

            let requestData = JSON.stringify({
                category: selectedCategory,
                country: country,
                name: name,
                date: date
            });

            // লোকাল স্টোরেজে সেভ করা
            let savedFiles = JSON.parse(localStorage.getItem('myDocsFiles')) || [];
            savedFiles.push({ category: selectedCategory, country: country, name: name, date: date });
            localStorage.setItem('myDocsFiles', JSON.stringify(savedFiles));

            closeModal();
            document.getElementById('newNameInput').value = '';
            document.getElementById('newDateInput').value = '';

            // টেলিগ্রাম বটের কাছে ডেটা পাঠানো এবং মিনি অ্যাপ বন্ধ করা
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.sendData(requestData);
            } else {
                alert("রিকোয়েস্ট সফলভাবে সাবমিট হয়েছে!");
                tg.close();
            }
        }

        function switchTab(tab) {
            let homeSec = document.getElementById('homeSection');
            let filesSec = document.getElementById('filesSection');
            let navHome = document.getElementById('navHome');
            let navFiles = document.getElementById('navFiles');

            if(tab === 'home') {
                homeSec.classList.add('active');
                filesSec.classList.remove('active');
                navHome.classList.add('active');
                navFiles.classList.remove('active');
            } else if(tab === 'files') {
                homeSec.classList.remove('active');
                filesSec.classList.add('active');
                navHome.classList.remove('active');
                navFiles.classList.add('active');
                loadMyFiles();
            }
        }

        function loadMyFiles() {
            let filesList = document.getElementById('filesList');
            let savedFiles = JSON.parse(localStorage.getItem('myDocsFiles')) || [];
            if(savedFiles.length === 0) {
                filesList.innerHTML = `<p style="font-size: 13px; color: #64748b; text-align: center; margin-top: 30px;">আপনার কোনো ফাইল সেভ করা নেই।</p>`;
                return;
            }
            let html = "";
            savedFiles.forEach((file) => {
                html += `<div class="file-item"><div><strong>${file.category}</strong><br><small>${file.name} | ${file.date}</small></div><span style="color: #22c55e;">Saved ✓</span></div>`;
            });
            filesList.innerHTML = html;
        }

        loadMyFiles();
    </script>
</body>
</html>
